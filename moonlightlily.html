<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Moonlight Lily — 3D Math Flower</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #051024 0%, #000000 100%);
      font-family: 'Segoe UI', sans-serif;
      touch-action: none; /* মোবাইলে স্ক্রল বাগ রোধ করতে */
    }
    #info {
      position: fixed;
      top: 35px;
      left: 0;
      right: 0;
      text-align: center;
      color: #00ffff;
      font-size: clamp(26px, 7vw, 48px);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-shadow: 0 0 20px rgba(0, 255, 255, 0.7);
      z-index: 5;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      text-align: center;
      color: #557799;
      font-size: clamp(12px, 3vw, 15px);
      letter-spacing: 0.05em;
      z-index: 5;
      pointer-events: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">Moonlight Lily</div>
  <div id="hint">Swipe to rotate • Pinch to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x051024, 0.05);

    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 3, 7);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 15;
    controls.target.set(0, 1.5, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.2;

    // 2. Bioluminescent Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.2));
    
    // Core glowing light
    const centerLight = new THREE.PointLight(0x00ffff, 8, 15);
    centerLight.position.set(0, 2, 0);
    scene.add(centerLight);

    const rimLight = new THREE.DirectionalLight(0x6600ff, 3);
    rimLight.position.set(-5, 5, -5);
    scene.add(rimLight);

    // 3. Mathematical Petal Generator (Lily Shape with Twist)
    function createLilyPetal(length, width, bend, twist, colorA, colorB) {
      const uSegs = 30; // Length
      const vSegs = 12; // Width
      const pos = [], cols = [], idx = [];
      
      const cA = new THREE.Color(colorA);
      const cB = new THREE.Color(colorB);
      const tempC = new THREE.Color();

      for (let i = 0; i <= uSegs; i++) {
        const u = i / uSegs; // 0 to 1
        
        // Color gradient along length
        tempC.copy(cA).lerp(cB, Math.pow(u, 0.7));

        // Petal Width Equation: Teardrop/Lily profile
        const wProfile = Math.sin(u * Math.PI) * (1.0 + u * 0.4) * (1.0 - u * 0.15);

        for (let j = 0; j <= vSegs; j++) {
          const v = (j / vSegs) * 2 - 1; // -1 to 1
          
          let x = width * v * wProfile;
          let y = length * u;
          let z = -bend * Math.pow(u, 1.8); // Curve backwards

          // Fold the base slightly inward like a real lily
          const fold = Math.abs(v) * (1 - u);
          z += fold * width * 0.4;

          // Twist Equation: Rotate X and Z around Y axis
          const theta = twist * u;
          const xx = x * Math.cos(theta) - z * Math.sin(theta);
          const zz = x * Math.sin(theta) + z * Math.cos(theta);

          pos.push(xx, y, zz);
          cols.push(tempC.r, tempC.g, tempC.b);
        }
      }

      for (let i = 0; i < uSegs; i++) {
        for (let j = 0; j < vSegs; j++) {
          const a = i * (vSegs + 1) + j;
          const b = a + vSegs + 1;
          idx.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(cols, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return geo;
    }

    // Material with slight transparency and vertex colors
    const petalMat = new THREE.MeshPhysicalMaterial({
      vertexColors: true,
      roughness: 0.15,
      metalness: 0.2,
      clearcoat: 0.8,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.85
    });

    // 4. Assemble the Lily
    const flower = new THREE.Group();
    const petalCount = 6;
    const petals = []; // Store for animation

    for (let i = 0; i < petalCount; i++) {
      const isOuter = i % 2 === 1;
      const angle = (i * Math.PI * 2) / petalCount;
      
      const len = isOuter ? 4.5 : 4.0;
      const wid = isOuter ? 1.2 : 1.4;
      const bend = isOuter ? 2.5 : 1.8;
      const twist = (i % 2 === 0 ? 0.2 : -0.2); // Alternating twist
      
      const geo = createLilyPetal(len, wid, bend, twist, 0x00ffff, 0x110055);
      const mesh = new THREE.Mesh(geo, petalMat);
      
      mesh.rotation.x = isOuter ? 1.0 : 0.7; // Lean outward
      mesh.position.y = isOuter ? -0.2 : 0;
      
      // Save initial tilt for animation
      mesh.userData = { baseTilt: mesh.rotation.x, speed: 1.5 + Math.random()*0.5 };
      petals.push(mesh);

      const wrapper = new THREE.Group();
      wrapper.rotation.y = angle;
      wrapper.add(mesh);
      flower.add(wrapper);
    }
    
    scene.add(flower);

    // 5. Magical Glowing Pollen / Particles (Particle System)
    const pCount = 150;
    const pGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(pCount * 3);
    const pVel = [];

    for (let i = 0; i < pCount; i++) {
      // Cylinder distribution
      const r = Math.random() * 0.4;
      const theta = Math.random() * Math.PI * 2;
      const y = Math.random() * 4;
      
      pPos[i*3] = r * Math.cos(theta);
      pPos[i*3+1] = y;
      pPos[i*3+2] = r * Math.sin(theta);
      
      pVel.push({
        y: 0.01 + Math.random() * 0.02,
        r: (Math.random() - 0.5) * 0.05
      });
    }

    pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    
    const pMat = new THREE.PointsMaterial({
      color: 0x00ffff,
      size: 0.06,
      transparent: true,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });
    
    const particles = new THREE.Points(pGeo, pMat);
    scene.add(particles);

    // 6. Events
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Animation Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      // Fluttering petals
      petals.forEach((petal, i) => {
        const { baseTilt, speed } = petal.userData;
        petal.rotation.x = baseTilt + Math.sin(t * speed) * 0.06;
      });

      // Floating particles
      const positions = particles.geometry.attributes.position.array;
      for (let i = 0; i < pCount; i++) {
        positions[i*3+1] += pVel[i].y; // Move up
        
        // Spiral motion
        const x = positions[i*3];
        const z = positions[i*3+2];
        const angle = pVel[i].r;
        positions[i*3] = x * Math.cos(angle) - z * Math.sin(angle);
        positions[i*3+2] = x * Math.sin(angle) + z * Math.cos(angle);

        // Reset if too high
        if (positions[i*3+1] > 5) {
          positions[i*3+1] = 0;
          positions[i*3] = (Math.random() - 0.5) * 0.5;
          positions[i*3+2] = (Math.random() - 0.5) * 0.5;
        }
      }
      particles.geometry.attributes.position.needsUpdate = true;
      
      // Floating flower
      flower.position.y = Math.sin(t) * 0.2;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
