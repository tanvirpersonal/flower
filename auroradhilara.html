<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Aurora Dahlia — Fibonacci Math</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b0a2b 0%, #050011 100%);
      font-family: 'Segoe UI', Tahoma, sans-serif;
      touch-action: none; /* মোবাইল স্ক্রলিং অফ */
    }
    #info {
      position: fixed;
      top: 30px;
      left: 0;
      right: 0;
      text-align: center;
      color: #ffb84d;
      font-size: clamp(26px, 7vw, 42px);
      font-weight: 300;
      letter-spacing: 0.1em;
      text-shadow: 0 0 15px rgba(255, 184, 77, 0.7);
      z-index: 5;
      pointer-events: none;
    }
    #hint {
      position: fixed;
      bottom: 25px;
      left: 0;
      right: 0;
      text-align: center;
      color: #9977aa;
      font-size: clamp(12px, 3vw, 15px);
      letter-spacing: 0.05em;
      z-index: 5;
      pointer-events: none;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="info">Aurora Dahlia</div>
  <div id="hint">Swipe to rotate • Pinch to zoom</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    // 1. Basic Setup
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050011, 0.03);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 8, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 4;
    controls.maxDistance = 20;
    controls.target.set(0, 0, 0);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.0;

    // 2. Magical Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));
    
    const centerLight = new THREE.PointLight(0xffdd00, 15, 12);
    centerLight.position.set(0, 1, 0);
    scene.add(centerLight);

    const rimLight = new THREE.DirectionalLight(0xff0088, 3);
    rimLight.position.set(5, 5, 5);
    scene.add(rimLight);

    // 3. Create a Single Optimized Petal Geometry
    function createPetal() {
      const uSeg = 10, vSeg = 4;
      const pos = [], idx = [];
      for (let i = 0; i <= uSeg; i++) {
        const u = i / uSeg; // Base to tip
        // Math: Wide at middle, sharp at tip
        const w = Math.sin(Math.pow(u, 0.7) * Math.PI) * (1.0 - u * 0.1); 
        for (let j = 0; j <= vSeg; j++) {
          const v = (j / vSeg) * 2 - 1; // Left to right
          
          const x = w * v * 0.25;
          const y = u * 2.5; 
          // Math: V-shaped crease in the middle and curved backwards
          const z = w * (1 - Math.abs(v)) * 0.15 - Math.pow(u, 2) * 0.4;
          pos.push(x, y, z);
        }
      }

      for (let i = 0; i < uSeg; i++) {
        for (let j = 0; j < vSeg; j++) {
          const a = i * (vSeg + 1) + j;
          const b = a + vSeg + 1;
          idx.push(a, b, a + 1, b, b + 1, a + 1);
        }
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
      geo.setIndex(idx);
      geo.computeVertexNormals();
      return geo;
    }

    // 4. Instanced Mesh for 800 Petals (Mobile Performance Booster!)
    const petalGeo = createPetal();
    const petalCount = 800; // ৮০০টি পাঁপড়ি!
    const petalMat = new THREE.MeshPhysicalMaterial({
      roughness: 0.1,
      metalness: 0.2,
      clearcoat: 0.6,
      side: THREE.DoubleSide
    });

    const dahlia = new THREE.InstancedMesh(petalGeo, petalMat, petalCount);
    const dummy = new THREE.Object3D();
    const petalData = []; // To store math variables for animation

    // Color Gradients
    const colorInner = new THREE.Color(0xffe600); // Glowing Yellow
    const colorMid = new THREE.Color(0xff0066);   // Neon Pink
    const colorOuter = new THREE.Color(0x1a0066); // Deep Space Blue
    const tempColor = new THREE.Color();

    for (let i = 0; i < petalCount; i++) {
      const t = i / petalCount; // 0 to 1 (Center to edge)
      const goldenAngle = 2.39996323; // 137.5 degrees
      const angle = i * goldenAngle;
      
      petalData.push({ t, angle });

      // Apply gradient color mathematically
      if (t < 0.4) {
        tempColor.copy(colorInner).lerp(colorMid, t / 0.4);
      } else {
        tempColor.copy(colorMid).lerp(colorOuter, (t - 0.4) / 0.6);
      }
      dahlia.setColorAt(i, tempColor);
    }
    
    dahlia.instanceColor.needsUpdate = true;
    scene.add(dahlia);

    // Glowing Core
    const coreGeo = new THREE.SphereGeometry(0.4, 32, 16);
    const coreMat = new THREE.MeshBasicMaterial({ color: 0xffddaa });
    scene.add(new THREE.Mesh(coreGeo, coreMat));

    // 5. Setup Function to Update Positions (For Breathing Animation)
    function updatePetals(time) {
      for (let i = 0; i < petalCount; i++) {
        const { t, angle } = petalData[i];
        
        // Ripple wave moving from center outwards
        const wave = Math.sin(t * 12 - time * 2) * 0.15;
        
        // Math: Distribution on a Paraboloid (Dome shape)
        const radius = Math.pow(t, 0.5) * 5.5; 
        const height = -Math.pow(radius, 2) * 0.12 + wave; 
        
        dummy.position.set(
          radius * Math.cos(angle),
          height,
          radius * Math.sin(angle)
        );
        
        // Point the petal outward and downward mathematically
        const outwardTilt = 0.5 + t * 3.0; // Outer petals bend down more
        const lookTarget = new THREE.Vector3(
          dummy.position.x, 
          dummy.position.y - outwardTilt, 
          dummy.position.z
        );
        
        // Align the petal's Y axis to lookTarget
        const quaternion = new THREE.Quaternion().setFromUnitVectors(
          new THREE.Vector3(0, 1, 0),
          lookTarget.clone().sub(dummy.position).normalize()
        );
        
        dummy.quaternion.copy(quaternion);
        
        // Inner petals are smaller, outer are bigger
        const scale = 0.1 + t * 0.9 + wave * 0.2;
        dummy.scale.set(scale, scale, scale);
        
        dummy.updateMatrix();
        dahlia.setMatrixAt(i, dummy.matrix);
      }
      dahlia.instanceMatrix.needsUpdate = true;
    }

    // 6. Responsive Resize
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // 7. Smooth Animation Loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();

      // Update 800 petals seamlessly
      updatePetals(time);
      
      // Floating effect
      dahlia.position.y = Math.sin(time) * 0.2;

      controls.update();
      renderer.render(scene, camera);
    }
    
    animate();
  </script>
</body>
</html>
