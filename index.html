<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematical Flower Bouquet</title><style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle,#180b25,#000 70%);font-family:system-ui,sans-serif}#title{position:fixed;top:25px;width:100%;text-align:center;color:#ff7eb3;font-size:clamp(25px,6vw,48px);z-index:2;pointer-events:none;text-shadow:0 0 18px #ff3d82}#hint{position:fixed;bottom:18px;width:100%;text-align:center;color:#aaa;font-size:13px;z-index:2;pointer-events:none}canvas{display:block}</style></head><body><div id="title">Mathematical Flower Bouquet</div><div id="hint">Drag to rotate • Scroll/pinch to zoom • Double-click to pause</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script><script type="module">import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createRose}from'./flowers/rose.js';import{createLotus}from'./flowers/lotus.js';const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100),renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});camera.position.set(0,2.2,8);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);const c=new OrbitControls(camera,renderer.domElement);c.enableDamping=true;c.autoRotate=true;c.autoRotateSpeed=.55;c.target.set(0,1.3,0);scene.add(new THREE.AmbientLight(0xffffff,1));const light=new THREE.PointLight(0xff4f9a,18,14);light.position.set(0,4,3);scene.add(light);const bouquet=new THREE.Group();function add(f,x,y,z,s){f.position.set(x,y,z);f.scale.setScalar(s);bouquet.add(f)}function stem(x,z,h,lean){const q=new THREE.CatmullRomCurve3([new THREE.Vector3(x,0,z),new THREE.Vector3(x+lean*.4,h*.5,z),new THREE.Vector3(x+lean,h,z)]);return new THREE.Mesh(new THREE.TubeGeometry(q,24,.035,8),new THREE.MeshStandardMaterial({color:0x236b3a}))}add(createRose(),-1.3,2.7,0,.85);add(createRose(),1.3,2.8,.1,.8);add(createLotus({petals:150}),0,2.5,.6,.7);add(createLotus({petals:120}),-.65,2.15,.8,.5);add(createLotus({petals:120}),.65,2.2,.8,.5);bouquet.add(stem(-1.2,0,2.7,-.3),stem(1.2,.1,2.8,.3),stem(0,.5,2.5,0),stem(-.55,.65,2.15,-.1),stem(.6,.65,2.2,.1));const wrap=new THREE.Mesh(new THREE.CylinderGeometry(1.35,.8,1.5,32,1,true),new THREE.MeshStandardMaterial({color:0x6d3158,transparent:true,opacity:.82,side:THREE.DoubleSide}));wrap.position.set(0,.65,.15);bouquet.add(wrap);scene.add(bouquet);function loop(){requestAnimationFrame(loop);const t=performance.now()/1000;bouquet.position.y=Math.sin(t*1.1)*.05;c.update();renderer.render(scene,camera)}loop();addEventListener('dblclick',()=>c.autoRotate=!c.autoRotate);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});</script></body></html>
