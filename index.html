<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mathematical Flowers</title><style>html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle,#180b25,#000 72%);font-family:system-ui,sans-serif}#title{position:fixed;top:24px;width:100%;text-align:center;color:#ff7eb3;font-size:clamp(24px,6vw,46px);z-index:2;pointer-events:none;text-shadow:0 0 18px #ff3d82}#hint{position:fixed;bottom:16px;width:100%;text-align:center;color:#aaa;font-size:13px;z-index:2;pointer-events:none}canvas{display:block}</style></head>
<body><div id="title">Mathematical Flowers</div><div id="hint">Each flower faces forward • Drag to inspect • Scroll/pinch to zoom</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';import{createRose}from'./flowers/rose.js';import{createLotus}from'./flowers/lotus.js';
const scene=new THREE.Scene();const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.8,11);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=5;controls.maxDistance=18;controls.target.set(0,1.7,0);controls.autoRotate=false;
scene.add(new THREE.AmbientLight(0xffffff,1.1));const key=new THREE.DirectionalLight(0xffb6d5,3);key.position.set(0,5,8);scene.add(key);const fill=new THREE.PointLight(0xff3d91,12,15);fill.position.set(0,2,4);scene.add(fill);
const row=new THREE.Group();
function place(f,x,y,s){f.position.set(x,y,0);f.scale.setScalar(s);/* front face: no per-flower rotation */row.add(f)}
// Clean side-by-side presentation; no bouquet overlap yet.
place(createRose(),-3.15,2.15,.82);place(createLotus({petals:160}),0,2.05,.70);place(createRose(),3.15,2.15,.82);
scene.add(row);
// Simple individual stems below each model, keeping every flower visually separate.
for(const x of[-3.15,0,3.15]){const curve=new THREE.LineCurve3(new THREE.Vector3(x,.15,0),new THREE.Vector3(x,1.25,0));const stem=new THREE.Mesh(new THREE.TubeGeometry(curve,16,.045,8,false),new THREE.MeshStandardMaterial({color:0x236b3a}));row.add(stem)}
const ground=new THREE.Mesh(new THREE.CircleGeometry(5.8,64),new THREE.MeshBasicMaterial({color:0x08030d,transparent:true,opacity:.5}));ground.rotation.x=-Math.PI/2;ground.position.y=.05;scene.add(ground);
function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
